services:
  # 1. Redis Database for the Task Queue
  - type: redis
    name: portfolio-redis
    ipAllowList: []
    plan: free

  # 2. FastAPI Backend Service
  - type: web
    name: portfolio-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: portfolio-redis
          property: connectionString

  # 3. Arq Background Worker
  - type: worker
    name: portfolio-worker
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "arq worker.tasks.WorkerSettings"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: portfolio-redis
          property: connectionString

  # 4. Next.js Frontend
  - type: web
    name: portfolio-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          type: web
          name: portfolio-backend
          property: host
